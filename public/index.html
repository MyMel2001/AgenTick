<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AgenTick — AI Operating Environment">
  <title>AgenTick</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Login/Register Screen -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-backdrop"></div>
    <div class="auth-container">
      <div class="auth-logo">
        <div class="auth-logo-icon">⚡</div>
        <h1>AgenTick</h1>
        <p class="auth-tagline">AI Operating Environment</p>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Sign In</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>
        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" autocomplete="username" required minlength="3" maxlength="32">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required minlength="6">
          </div>
          <div id="login-error" class="auth-error"></div>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">Unlock</button>
        </form>
        <form id="register-form" class="auth-form">
          <div class="form-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" autocomplete="username" required minlength="3" maxlength="32">
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" autocomplete="new-password" required minlength="6">
          </div>
          <div class="form-group">
            <label for="reg-password2">Confirm Password</label>
            <input type="password" id="reg-password2" autocomplete="new-password" required minlength="6">
          </div>
          <div id="register-error" class="auth-error"></div>
          <button type="submit" class="btn btn-primary btn-full" id="register-btn">Initialize</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Main Operating Environment -->
  <div id="desktop" class="desktop hidden">
    <div id="wallpaper" class="wallpaper"></div>

    <div class="main-shell">
      <div class="chat-container">
        <div class="chat-header">
          <div class="chat-title">AgenTick AI</div>
          <div class="chat-actions">
            <button id="settings-toggle" class="icon-btn" title="AI Settings">⚙️</button>
            <button id="logout-btn" class="icon-btn" title="Sign Out">🚪</button>
          </div>
        </div>
        <div id="term-history" class="chat-history">
          <!-- Messages will be injected here -->
        </div>
        <div class="chat-input-area">
          <input type="text" id="term-input" class="chat-input" placeholder="Interact with your environment..." autocomplete="off">
          <button id="ai-btn" class="ai-btn">⚡</button>
        </div>
      </div>
    </div>

    <!-- Modals (Settings, etc) -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Environment Settings</h3>
          <button class="modal-close">✕</button>
        </div>
        <div id="settings-body" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="/js/crypto.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/terminal.js"></script>
  <script src="/js/browser.js"></script>
  <script src="/js/filemanager.js"></script>
  <script src="/js/notes.js"></script>
  <script src="/js/cron.js"></script>
  <script src="/js/scripts.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
